<div
  class="victory-modal xux-modal-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="battle-steal-title"
  (click)="onBackdropClick()"
  (keydown)="onModalKeydown($event)">
  <div #dialogRoot class="battle-dialog battle-dialog--info victory-content victory-content--prize xux-modal-card" tabindex="-1" (click)="$event.stopPropagation()">
    <h2 class="battle-dialog-title victory-title xux-modal-title" id="battle-steal-title">PRIZE</h2>
    <p class="battle-dialog-text xux-modal-text">Choose one Xuxemon from your rival.</p>
    <div class="xuxemon-list">
      @for (xuxemon of vm.stealOptions(); track xuxemon.adquired_id || xuxemon.id) {
        <div
          class="xuxemon-item-card"
          role="button"
          tabindex="0"
          (click)="vm.confirmPrizeSelection(xuxemon)"
          (keydown.enter)="vm.confirmPrizeSelection(xuxemon)"
          (keydown.space)="$event.preventDefault(); vm.confirmPrizeSelection(xuxemon)">
          <img [src]="xuxemon.image_url" [alt]="xuxemon.name">
          <div class="item-card-info">
            <span class="item-card-name">{{ xuxemon.name }}</span>
            <div class="item-card-stats">
              <span>HP: {{ xuxemon.current_hp ?? xuxemon.hp }}/{{ xuxemon.hp }}</span>
              <span>ATK: {{ xuxemon.attack }}</span>
              <span>DEF: {{ xuxemon.defense }}</span>
            </div>
          </div>
        </div>
      }
    </div>
    <button type="button" class="battle-dialog-btn battle-dialog-btn--primary btn-continue xux-modal-btn" (click)="vm.skipPrizeSelection()" [disabled]="vm.isSubmittingBattleResult()">SKIP</button>
  </div>
</div>
