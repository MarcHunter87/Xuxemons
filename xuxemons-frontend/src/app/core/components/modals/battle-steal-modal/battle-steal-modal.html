<div
  class="victory-modal xux-modal-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="battle-steal-title"
  (click)="onBackdropClick()"
  (keydown)="onModalKeydown($event)">
  <div #dialogRoot class="battle-dialog battle-dialog--info victory-content victory-content--prize xux-modal-card" tabindex="-1" (click)="$event.stopPropagation()">
    <h2 class="battle-dialog-title victory-title xux-modal-title" id="battle-steal-title">PRIZE</h2>
    <div aria-live="assertive" aria-atomic="true" class="visually-hidden">{{ liveMessage }}</div>
    <p class="battle-dialog-text xux-modal-text">Choose one Xuxemon from your rival.</p>
    <div class="xuxemon-list">
      @for (xuxemon of vm.stealOptions(); track xuxemon.adquired_id || xuxemon.id) {
        <div
          class="prize-xux-card"
          [class.type-power]="isXuxemonType(xuxemon, 'power')"
          [class.type-speed]="isXuxemonType(xuxemon, 'speed')"
          [class.type-technical]="isXuxemonType(xuxemon, 'technical')"
          role="button"
          tabindex="0"
          (click)="vm.confirmPrizeSelection(xuxemon)"
          (keydown.enter)="vm.confirmPrizeSelection(xuxemon)"
          (keydown.space)="$event.preventDefault(); vm.confirmPrizeSelection(xuxemon)">
          <img class="prize-xux-card__icon" [src]="xuxemon.image_url" [alt]="xuxemon.name">
          <span class="prize-xux-card__name">{{ xuxemon.name }}</span>
          <div class="prize-xux-card__stats" aria-label="Stats">
            <span class="prize-stat prize-stat--hp">
              <span class="prize-stat__label">HP</span>
              <span class="prize-stat__value">{{ prizeStat(xuxemon, 'hp') }}</span>
            </span>
            <span class="prize-stat prize-stat--atk">
              <span class="prize-stat__label">ATK</span>
              <span class="prize-stat__value">{{ prizeStat(xuxemon, 'attack') }}</span>
            </span>
            <span class="prize-stat prize-stat--def">
              <span class="prize-stat__label">DEF</span>
              <span class="prize-stat__value">{{ prizeStat(xuxemon, 'defense') }}</span>
            </span>
          </div>
        </div>
      }
    </div>
    <button type="button" class="battle-dialog-btn battle-dialog-btn--primary btn-continue xux-modal-btn" (click)="vm.skipPrizeSelection()" [disabled]="vm.isSubmittingBattleResult()">SKIP</button>
  </div>
</div>
