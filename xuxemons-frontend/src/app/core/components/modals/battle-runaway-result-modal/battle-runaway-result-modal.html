<div
  class="victory-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="battle-runaway-result-title"
  (click)="onBackdropClick()"
  (keydown)="onModalKeydown($event)">
  <div #dialogRoot class="battle-dialog battle-dialog--info" tabindex="-1" (click)="$event.stopPropagation()">
    <h2 class="battle-dialog-title" id="battle-runaway-result-title">Run Away</h2>
    <p class="battle-dialog-text">{{ vm.runawayResultMessage() }}</p>
    <div class="battle-dialog-actions battle-dialog-actions--single">
      <button type="button" class="battle-dialog-btn battle-dialog-btn--primary" (click)="vm.closeRunawayResultModal()">Continue</button>
    </div>
  </div>
</div>
